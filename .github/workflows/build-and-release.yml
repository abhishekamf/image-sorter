name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: python test_app.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build application
      run: |
        pyinstaller --onefile --windowed --name=DuplicatePhotoCleaner --distpath=dist --workpath=build --specpath=build main.py
      
    - name: Verify build
      shell: bash
      run: |
        ls -la dist/
        if [ "$RUNNER_OS" = "Windows" ]; then
          ls -la dist/DuplicatePhotoCleaner.exe
        else
          ls -la dist/DuplicatePhotoCleaner
        fi

    - name: Create distribution package
      shell: bash
      run: |
        mkdir -p "DuplicatePhotoCleaner-${{ matrix.name }}"
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp dist/DuplicatePhotoCleaner.exe "DuplicatePhotoCleaner-${{ matrix.name }}/"
          echo "Duplicate Photo Cleaner for Windows" > "DuplicatePhotoCleaner-${{ matrix.name }}/README.txt"
          echo "Double-click DuplicatePhotoCleaner.exe to run" >> "DuplicatePhotoCleaner-${{ matrix.name }}/README.txt"
        else
          cp dist/DuplicatePhotoCleaner "DuplicatePhotoCleaner-${{ matrix.name }}/"
          chmod +x "DuplicatePhotoCleaner-${{ matrix.name }}/DuplicatePhotoCleaner"
          echo "Duplicate Photo Cleaner for ${{ matrix.name }}" > "DuplicatePhotoCleaner-${{ matrix.name }}/README.txt"
          echo "Run: ./DuplicatePhotoCleaner" >> "DuplicatePhotoCleaner-${{ matrix.name }}/README.txt"
        fi

    - name: Create zip archive
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          powershell -Command "Compress-Archive -Path 'DuplicatePhotoCleaner-${{ matrix.name }}' -DestinationPath 'DuplicatePhotoCleaner-${{ matrix.name }}.zip'"
        else
          zip -r "DuplicatePhotoCleaner-${{ matrix.name }}.zip" "DuplicatePhotoCleaner-${{ matrix.name }}/"
        fi
        ls -la "DuplicatePhotoCleaner-${{ matrix.name }}.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DuplicatePhotoCleaner-${{ matrix.name }}
        path: DuplicatePhotoCleaner-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: List downloaded files
      run: |
        echo "Downloaded artifacts:"
        find . -name "*.zip" -type f
        ls -la */

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          DuplicatePhotoCleaner-windows/DuplicatePhotoCleaner-windows.zip
          DuplicatePhotoCleaner-macos/DuplicatePhotoCleaner-macos.zip
          DuplicatePhotoCleaner-linux/DuplicatePhotoCleaner-linux.zip
        body: |
          ## 🚀 Duplicate Photo Cleaner ${{ github.ref_name }}
          
          ### 📥 Downloads
          
          - **🪟 Windows**: DuplicatePhotoCleaner-windows.zip
          - **🍎 macOS**: DuplicatePhotoCleaner-macos.zip  
          - **🐧 Linux**: DuplicatePhotoCleaner-linux.zip
          
          ### 📦 Installation
          
          1. Download the zip file for your operating system
          2. Extract the contents to any folder
          3. Run the executable inside the extracted folder
          
          ### ✨ What's New
          
          - Cross-platform duplicate photo detection
          - Safe removal with holding folder backup
          - Multi-user support with authentication
          - Complete action history tracking
          
          **Note**: On first run, the application will create a user data folder in your home directory.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
