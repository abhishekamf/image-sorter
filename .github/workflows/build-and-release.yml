name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: .exe
          - os: macos-latest
            name: macos
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow bcrypt pyinstaller

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --name=DuplicatePhotoCleaner main.py
        mkdir DuplicatePhotoCleaner-windows
        copy dist\DuplicatePhotoCleaner.exe DuplicatePhotoCleaner-windows\
        powershell Compress-Archive DuplicatePhotoCleaner-windows DuplicatePhotoCleaner-windows.zip

    - name: Build macOS
      if: matrix.os == 'macos-latest'  
      run: |
        pyinstaller --onefile --windowed --name=DuplicatePhotoCleaner main.py
        mkdir DuplicatePhotoCleaner-macos
        cp dist/DuplicatePhotoCleaner DuplicatePhotoCleaner-macos/
        chmod +x DuplicatePhotoCleaner-macos/DuplicatePhotoCleaner
        zip -r DuplicatePhotoCleaner-macos.zip DuplicatePhotoCleaner-macos/

    - uses: actions/upload-artifact@v4
      with:
        name: DuplicatePhotoCleaner-${{ matrix.name }}
        path: DuplicatePhotoCleaner-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
    - uses: softprops/action-gh-release@v2
      with:
        files: |
          DuplicatePhotoCleaner-windows/DuplicatePhotoCleaner-windows.zip
          DuplicatePhotoCleaner-macos/DuplicatePhotoCleaner-macos.zip
        body: |
          ## Duplicate Photo Cleaner ${{ github.ref_name }}
          
          **Downloads:**
          - Windows: DuplicatePhotoCleaner-windows.zip
          - macOS: DuplicatePhotoCleaner-macos.zip
          
          Extract and run the executable.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
