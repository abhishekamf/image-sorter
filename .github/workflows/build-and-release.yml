name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Setup virtual display
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb python3-tk
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      env:
        DISPLAY: :99
      run: python test_app.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            python-version: '3.11'
          - os: macos-latest
            name: macos
            python-version: '3.11'
          - os: ubuntu-latest
            name: linux
            python-version: '3.11'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb python3-tk
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build application (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --name=DuplicatePhotoCleaner --add-data="src;src" --hidden-import=PIL._tkinter_finder --hidden-import=bcrypt._bcrypt --hidden-import=tkinter --hidden-import=tkinter.ttk main.py

    - name: Build application (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --windowed --name=DuplicatePhotoCleaner --add-data="src:src" --hidden-import=PIL._tkinter_finder --hidden-import=bcrypt._bcrypt --hidden-import=tkinter --hidden-import=tkinter.ttk main.py

    - name: Build application (Linux)
      if: matrix.os == 'ubuntu-latest'
      env:
        DISPLAY: :99
      run: |
        pyinstaller --onefile --windowed --name=DuplicatePhotoCleaner --add-data="src:src" --hidden-import=PIL._tkinter_finder --hidden-import=bcrypt._bcrypt --hidden-import=tkinter --hidden-import=tkinter.ttk main.py

    - name: Create distribution folder and zip (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir DuplicatePhotoCleaner-${{ matrix.name }}
        copy dist\DuplicatePhotoCleaner.exe DuplicatePhotoCleaner-${{ matrix.name }}\
        echo "Duplicate Photo Cleaner - Windows" > DuplicatePhotoCleaner-${{ matrix.name }}\README.txt
        echo "Double-click DuplicatePhotoCleaner.exe to run the application." >> DuplicatePhotoCleaner-${{ matrix.name }}\README.txt
        powershell Compress-Archive -Path "DuplicatePhotoCleaner-${{ matrix.name }}" -DestinationPath "DuplicatePhotoCleaner-${{ matrix.name }}.zip"
      shell: cmd

    - name: Create distribution folder and zip (macOS/Linux)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir DuplicatePhotoCleaner-${{ matrix.name }}
        cp dist/DuplicatePhotoCleaner DuplicatePhotoCleaner-${{ matrix.name }}/
        echo "Duplicate Photo Cleaner - ${{ matrix.name }}" > DuplicatePhotoCleaner-${{ matrix.name }}/README.txt
        echo "Run ./DuplicatePhotoCleaner to start the application." >> DuplicatePhotoCleaner-${{ matrix.name }}/README.txt
        chmod +x DuplicatePhotoCleaner-${{ matrix.name }}/DuplicatePhotoCleaner
        zip -r DuplicatePhotoCleaner-${{ matrix.name }}.zip DuplicatePhotoCleaner-${{ matrix.name }}/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DuplicatePhotoCleaner-${{ matrix.name }}
        path: DuplicatePhotoCleaner-${{ matrix.name }}.zip
        retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release-files
        find artifacts -name "*.zip" -exec cp {} release-files/ \;
        ls -la release-files/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-files/*.zip
        body: |
          ## 🚀 Duplicate Photo Cleaner ${{ github.ref_name }}
          
          ### 📥 Downloads
          
          - **🪟 Windows**: `DuplicatePhotoCleaner-windows.zip`
          - **🍎 macOS**: `DuplicatePhotoCleaner-macos.zip`  
          - **🐧 Linux**: `DuplicatePhotoCleaner-linux.zip`
          
          ### 📦 Installation
          
          1. Download the zip file for your OS
          2. Extract the contents
          3. Run the executable inside
          
          ### ✨ Features
          
          - Smart duplicate photo detection
          - Safe removal with holding folder
          - Multi-user authentication
          - Action history tracking
          - Cross-platform compatibility
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
