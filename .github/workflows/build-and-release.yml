name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name=DuplicatePhotoCleaner main.py

    - name: Create package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir DuplicatePhotoCleaner-windows
        copy dist\DuplicatePhotoCleaner.exe DuplicatePhotoCleaner-windows\
        echo "Duplicate Photo Cleaner - Right-click and run as administrator if needed" > DuplicatePhotoCleaner-windows\README.txt
        powershell Compress-Archive DuplicatePhotoCleaner-windows DuplicatePhotoCleaner-windows.zip

    - name: Create package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        mkdir DuplicatePhotoCleaner-macos
        cp dist/DuplicatePhotoCleaner DuplicatePhotoCleaner-macos/
        chmod +x DuplicatePhotoCleaner-macos/DuplicatePhotoCleaner
        echo "Duplicate Photo Cleaner - If macOS blocks it, right-click and choose Open" > DuplicatePhotoCleaner-macos/README.txt
        zip -r DuplicatePhotoCleaner-macos.zip DuplicatePhotoCleaner-macos/

    - uses: actions/upload-artifact@v4
      with:
        name: DuplicatePhotoCleaner-${{ matrix.name }}
        path: DuplicatePhotoCleaner-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
    - uses: softprops/action-gh-release@v2
      with:
        files: |
          DuplicatePhotoCleaner-windows/DuplicatePhotoCleaner-windows.zip
          DuplicatePhotoCleaner-macos/DuplicatePhotoCleaner-macos.zip
        body: |
          ## 🖼️ Duplicate Photo Cleaner ${{ github.ref_name }}
          
          **Fixed macOS compatibility issues!**
          
          **Downloads:**
          - **Windows**: DuplicatePhotoCleaner-windows.zip
          - **macOS**: DuplicatePhotoCleaner-macos.zip
          
          **Installation:**
          1. Download and extract the zip
          2. **macOS**: Right-click DuplicatePhotoCleaner → Open (if blocked by security)
          3. **Windows**: Run DuplicatePhotoCleaner.exe (allow in Windows Defender if prompted)
          
          **Features:**
          - ✅ Smart duplicate detection by file size
          - ✅ Safe deletion (moves to ~/DuplicateCleanerTrash/)
          - ✅ Multiple folder scanning
          - ✅ Simple, reliable interface
          - ✅ Works without internet connection
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
