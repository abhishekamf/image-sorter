```yaml name: Build Windows Executable on: release: types: [published] workflow_dispatch:

jobs: build: runs-on: windows-latest steps: - name: Checkout code uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
  
  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
  
  - name: Build executable with PyInstaller
    run: |
      pyinstaller --onefile --windowed --name "DuplicatePhotoCleaner" main.py
  
  - name: Upload executable to release
    uses: softprops/action-gh-release@v1
    with:
      files: dist/DuplicatePhotoCleaner.exe
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
